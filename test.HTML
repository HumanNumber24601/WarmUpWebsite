
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Audio Stream</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        .track-list {
            margin-top: 20px;
        }
        .track-item {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .track-name {
            font-weight: bold;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <h2>Warm Up Website Beta</h2>
    <p>by Samuel</p>

    <div class="track-list">
        <!-- warm up 1 -->
        <div class="track-item">
            <div class="track-name">warm up 1</div>
            <audio controls preload="metadata">
                <source src="1.wav" type="audio/mpeg">
            </audio>
        </div>

        <!-- warm up 2 -->
        <div class="track-item">
            <div class="track-name">warm up 2</div>
		<p>this track has 4 seconds of delay</p>
            <audio controls preload="metadata">
                <source src="2.wav" type="audio/mpeg">
            </audio>
        </div>
        <!-- warm up 3 -->
        <div class="track-item">
            <div class="track-name">warm up 3</div>
            <audio controls preload="metadata">
                <source src="3.wav" type="audio/mpeg">
            </audio>
        </div>
        <!-- warm up 4 -->
        <div class="track-item">
            <div class="track-name">warm up 4</div>
            <audio controls preload="metadata">
                <source src="4.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</body>
</html>
